<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Jambra</title>
  <meta name="description" content="Mural colaborativo para desenhar, colar post-its e trocar ideias ao vivo.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/konva@9.3/konva.min.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-select" viewBox="0 0 24 24"><path d="M5 3l14 8-6.2 1.8L10 19z"/></symbol>
  <symbol id="i-hand" viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-6-2.4l-3.6-3.6a2 2 0 0 1 2.8-2.8L7 15"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-highlighter" viewBox="0 0 24 24"><path d="M9 11l-6 6v3h9l3-3"/><path d="M22 12l-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></symbol>
  <symbol id="i-eraser" viewBox="0 0 24 24"><path d="M7 21l-4.3-4.3a1 1 0 0 1 0-1.4l10-10a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L11 21"/><path d="M22 21H7M5 11l9 9"/></symbol>
  <symbol id="i-sticky" viewBox="0 0 24 24"><path d="M4 4h16v10l-6 6H4z"/><path d="M14 20v-6h6"/></symbol>
  <symbol id="i-text" viewBox="0 0 24 24"><path d="M4 7V5h16v2M12 5v14M9 19h6"/></symbol>
  <symbol id="i-shape" viewBox="0 0 24 24"><rect x="3" y="3" width="10" height="10" rx="1.5"/><circle cx="16" cy="16" r="5"/></symbol>
  <symbol id="i-rect" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/></symbol>
  <symbol id="i-ellipse" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="7"/></symbol>
  <symbol id="i-line" viewBox="0 0 24 24"><path d="M5 19L19 5"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 19L19 5M10 5h9v9"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></symbol>
  <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M17.5 19H7a5 5 0 1 1 .9-9.9A6 6 0 0 1 19 11a4 4 0 0 1-1.5 8z"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
  <symbol id="i-del" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15M10 11v6M14 11v6"/></symbol>
  <symbol id="i-dup" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></symbol>
  <symbol id="i-front" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="1.5" fill="currentColor"/><path d="M15 5V4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h1"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><rect x="3" y="3" width="12" height="12" rx="1.5" fill="currentColor"/><path d="M19 9h1a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H10a1 1 0 0 1-1-1v-1"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-fill" viewBox="0 0 24 24"><path d="M19 11l-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2a2 2 0 0 0 2.8 0z"/><path d="M5 2l5 5M2 13h15M22 20a2 2 0 1 1-4 0c0-1.6 2-3 2-3s2 1.4 2 3z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
</svg>

<header class="topbar">
  <button class="brand" data-action="home" title="Início"><img src="favicon.svg" alt=""><span>Jambra</span></button>
  <input id="title" class="title" placeholder="Mural sem título" maxlength="80" aria-label="Nome do mural" autocomplete="off">
  <div class="pager">
    <button class="icon-btn" id="page-prev" title="Quadro anterior (PgUp)"><svg><use href="#i-left"/></svg></button>
    <button id="page-label" title="Mostrar/ocultar os quadros"><span id="page-num">1 / 1</span><svg><use href="#i-down"/></svg></button>
    <button class="icon-btn" id="page-next" title="Próximo quadro (PgDn)"><svg><use href="#i-right"/></svg></button>
    <button class="icon-btn" id="page-add" title="Novo quadro"><svg><use href="#i-plus"/></svg></button>
  </div>
  <div class="spacer"></div>
  <div id="people" class="people"></div>
  <span id="status" class="status" data-s="connecting" title="Conectando…"></span>
  <div class="menu-wrap">
    <button id="btn-drive" class="btn" data-state="off" aria-haspopup="menu"><svg><use href="#i-cloud"/></svg><span>Google Drive</span><svg class="caret"><use href="#i-down"/></svg></button>
    <div id="drive-menu" class="menu drive-menu" hidden></div>
  </div>
  <button id="btn-share" class="btn primary"><svg><use href="#i-link"/></svg><span>Compartilhar</span></button>
  <div class="menu-wrap">
    <button id="btn-menu" class="icon-btn" title="Mais opções"><svg><use href="#i-more"/></svg></button>
    <div id="menu" class="menu" hidden>
      <button data-action="new">Novo mural</button>
      <button data-action="open-drive">Abrir do Google Drive…</button>
      <button data-action="import">Importar arquivo…</button>
      <button data-action="download">Baixar cópia (.json)</button>
      <button data-action="export-png">Exportar quadro como imagem</button>
      <hr>
      <button data-action="rename-board">Renomear mural</button>
      <button data-action="rename-me">Mudar meu nome</button>
      <button data-action="delete-page" class="danger">Excluir este quadro</button>
      <button data-action="home">Voltar ao início</button>
    </div>
  </div>
</header>

<div id="frames" class="frames" aria-label="Quadros"></div>

<main class="stage-wrap">
  <div id="board" data-tool="pen"></div>

  <nav class="toolbar" id="toolbar" aria-label="Ferramentas">
    <button class="tool" data-tool="select" title="Selecionar (V)"><svg><use href="#i-select"/></svg></button>
    <button class="tool" data-tool="hand" title="Mover a tela (H ou segure espaço)"><svg><use href="#i-hand"/></svg></button>
    <button class="tool" data-tool="pen" title="Caneta (P)"><svg><use href="#i-pen"/></svg></button>
    <button class="tool" data-tool="highlighter" title="Marca-texto (M)"><svg><use href="#i-highlighter"/></svg></button>
    <button class="tool" data-tool="eraser" title="Borracha (E)"><svg><use href="#i-eraser"/></svg></button>
    <button class="tool" data-tool="sticky" title="Post-it (N)"><svg><use href="#i-sticky"/></svg></button>
    <button class="tool" data-tool="text" title="Texto (T)"><svg><use href="#i-text"/></svg></button>
    <button class="tool" data-tool="shape" title="Formas (S)"><svg><use href="#i-shape"/></svg></button>
    <button class="tool" data-action="image" title="Imagem (I) — também dá para colar ou arrastar"><svg><use href="#i-image"/></svg></button>
    <hr>
    <button class="tool" id="btn-undo" data-action="undo" title="Desfazer (Ctrl+Z)"><svg><use href="#i-undo"/></svg></button>
    <button class="tool" id="btn-redo" data-action="redo" title="Refazer (Ctrl+Shift+Z)"><svg><use href="#i-redo"/></svg></button>
  </nav>

  <div id="tool-panel" class="panel" hidden></div>
  <div id="selbar" class="selbar" hidden></div>

  <div class="zoom">
    <button class="icon-btn" data-action="zoom-out" title="Diminuir zoom (Ctrl −)"><svg><use href="#i-minus"/></svg></button>
    <button id="zoom-label" data-action="zoom-reset" title="Voltar a 100%">100%</button>
    <button class="icon-btn" data-action="zoom-in" title="Aumentar zoom (Ctrl +)"><svg><use href="#i-plus"/></svg></button>
    <button class="icon-btn" data-action="zoom-fit" title="Ver tudo (Ctrl 0)"><svg><use href="#i-fit"/></svg></button>
  </div>
</main>

<section id="home" class="home" hidden>
  <div class="home-card">
    <div class="home-logo"><img src="favicon.svg" alt=""><h1>Jambra</h1></div>
    <p class="lead">Um mural colaborativo para desenhar, colar post-its e trocar ideias ao vivo, com seus murais salvos no Google Drive.</p>
    <div class="home-actions">
      <button class="btn primary big" data-action="new"><svg><use href="#i-plus"/></svg>Novo mural</button>
      <button class="btn big" data-action="open-drive"><svg><use href="#i-cloud"/></svg>Abrir do Google Drive</button>
      <button class="btn big ghost" data-action="import">Importar arquivo (.json)</button>
    </div>
    <div id="setup-note" class="note" hidden></div>
    <h3>Recentes</h3>
    <ul id="recents"></ul>
    <p class="home-foot"><a href="privacy.html">Política de privacidade</a></p>
  </div>
</section>

<div id="modal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header><h2 id="modal-title"></h2><button class="icon-btn" data-close title="Fechar"><svg><use href="#i-close"/></svg></button></header>
    <div id="modal-body"></div>
  </div>
</div>

<input type="file" id="file-image" accept="image/*" multiple hidden>
<input type="file" id="file-json" accept=".json,application/json" hidden>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

</body>
</html>
